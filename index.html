<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EX-M2 mirino</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EX-M2">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<style>

/* --- Token Grado Zero --- */
:root {
  --surface: #ffffff; --ink: #000000; --on-ink: #ffffff;
  --line: var(--ink); --focus-ring: var(--ink); --surface-inverse: var(--ink); --ink-inverse: var(--on-ink);
  --overlay: rgba(0,0,0,.6);
  --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono: Menlo, "SF Mono", Consolas, "DejaVu Sans Mono", monospace;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
  --radius-none: 0; --radius-pill: 9999px; --border-hairline: 1px;
  --control-height: 28px; --control-pad-x: 8px; --fader-cursor: 3px;
  --toggle-w: 36px; --toggle-h: 20px; --toggle-knob: 14px;
  --icon-s: 12px; --icon-m: 16px; --focus-offset: 2px;
  --opacity-disabled: .4; --opacity-muted: .5;
  color-scheme: light;
}
:root[data-theme="dark"] { --surface: #000000; --ink: #ffffff; --on-ink: #000000; --overlay: rgba(0,0,0,.75); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--surface); color: var(--ink); font: 400 16px/22px var(--font-sans); letter-spacing: 0; }
h1, h2, h3, p { margin: 0; font-weight: 400; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* --- Componenti (dal bundle Grado Zero) --- */
.gz-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); height: var(--control-height); min-width: var(--control-height); padding: 0 var(--control-pad-x); font: 400 16px/1 var(--font-sans); color: var(--ink-inverse); background: var(--surface-inverse); border: var(--border-hairline) solid var(--line); border-radius: 0; cursor: pointer; white-space: nowrap; }
.gz-btn:hover { background: var(--surface); color: var(--ink); }
.gz-btn:focus-visible { outline: var(--border-hairline) solid var(--focus-ring); outline-offset: var(--focus-offset); }
.gz-btn:active { background: var(--surface); color: var(--ink); outline: var(--border-hairline) solid currentColor; outline-offset: -4px; }
.gz-btn--secondary { background: var(--surface); color: var(--ink); }
.gz-btn--secondary:hover, .gz-btn--secondary:active { background: var(--surface-inverse); color: var(--ink-inverse); }
.gz-btn--ghost { background: transparent; color: var(--ink); border-color: transparent; }
.gz-btn--ghost:hover, .gz-btn--ghost:active { border-color: var(--line); background: transparent; color: var(--ink); }
.gz-btn[aria-pressed="true"] { background: var(--surface-inverse); color: var(--ink-inverse); border-color: var(--line); }
.gz-btn[disabled] { opacity: var(--opacity-disabled); cursor: not-allowed; }

.gz-field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.gz-field__label { font: 400 10px/14px var(--font-sans); }
.gz-select { position: relative; display: block; }
.gz-select select { width: 100%; height: var(--control-height); padding: 0 calc(var(--control-pad-x) + var(--icon-s) + var(--space-1)) 0 var(--control-pad-x); font: 400 16px/1 var(--font-sans); color: var(--ink); background: var(--surface); border: var(--border-hairline) solid var(--line); border-radius: 0; -webkit-appearance: none; appearance: none; cursor: pointer; }
.gz-select select:focus { outline: none; }
.gz-select select:focus-visible { outline: var(--border-hairline) solid var(--focus-ring); outline-offset: var(--focus-offset); }
.gz-select__chevron { position: absolute; top: 50%; right: var(--control-pad-x); width: var(--icon-s); height: var(--icon-s); margin-top: calc(var(--icon-s) / -2); pointer-events: none; display: block; }

.gz-toggle { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); font: 400 16px/22px var(--font-sans); cursor: pointer; }
.gz-toggle input { -webkit-appearance: none; appearance: none; position: relative; margin: 0; width: var(--toggle-w); height: var(--toggle-h); flex: none; background: var(--surface); border: var(--border-hairline) solid var(--line); border-radius: var(--radius-pill); cursor: pointer; }
.gz-toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: var(--toggle-knob); height: var(--toggle-knob); border-radius: var(--radius-pill); background: var(--ink); }
.gz-toggle input:checked { background: var(--surface-inverse); }
.gz-toggle input:checked::after { left: calc(var(--toggle-w) - var(--toggle-knob) - 4px); background: var(--ink-inverse); }
.gz-toggle input:focus { outline: none; }
.gz-toggle input:focus-visible { outline: var(--border-hairline) solid var(--focus-ring); outline-offset: var(--focus-offset); }
.gz-toggle__text { display: flex; flex-direction: column; }
.gz-toggle__help { font: italic 400 10px/14px var(--font-sans); }
@media (prefers-reduced-motion: no-preference) { .gz-toggle input::after { transition: left 120ms ease-out; } }

.gz-fader { display: grid; grid-template-columns: 12ch minmax(0, 1fr) 8ch; align-items: center; gap: var(--space-2); height: var(--control-height); padding: 0 var(--space-1); font: 400 16px/22px var(--font-sans); color: var(--ink); background: var(--surface); }
.gz-fader__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gz-fader__value { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.gz-fader__rail { position: relative; align-self: stretch; }
.gz-fader input[type="range"] { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: ew-resize; }
.gz-fader input[type="range"]:focus { outline: none; }
.gz-fader input[type="range"]:focus-visible { outline: var(--border-hairline) solid var(--focus-ring); outline-offset: 0; }
.gz-fader input[type="range"]::-webkit-slider-runnable-track { height: 100%; background: transparent; }
.gz-fader input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: var(--fader-cursor); height: var(--control-height); background: var(--ink); border: 0; border-radius: 0; }
.gz-fader input[type="range"]::-moz-range-track { height: 100%; background: transparent; }
.gz-fader input[type="range"]::-moz-range-thumb { width: var(--fader-cursor); height: var(--control-height); background: var(--ink); border: 0; border-radius: 0; }
.gz-fader.is-off .gz-fader__value { opacity: var(--opacity-muted); }

.gz-grid-area { container-type: inline-size; }
.gz-grid { display: grid; grid-template-columns: repeat(var(--gz-grid-cols, 3), minmax(0, 1fr)); }
.gz-grid__col { min-width: 0; }
@container (min-width: 761px) { .gz-grid__col + .gz-grid__col { margin-left: calc(-1 * var(--border-hairline)); } }
@container (max-width: 760px) { .gz-grid { grid-template-columns: minmax(0, 1fr); } .gz-grid__col + .gz-grid__col .gz-grid__head { border-top: 0; } }
.gz-grid__head, .gz-grid .gz-fader { border: var(--border-hairline) solid var(--line); border-top: 0; }
.gz-grid__head { display: flex; align-items: center; justify-content: space-between; height: var(--control-height); padding: 0 var(--space-1); border-top: var(--border-hairline) solid var(--line); }
.gz-grid__title { font: inherit; }
.gz-grid__aside { font-style: italic; }

.gz-term { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; font: 400 14px/20px var(--font-mono); color: var(--ink); }
.gz-term__meta, .gz-term__log { opacity: var(--opacity-muted); }
.gz-term__meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: var(--space-2) var(--space-4); margin: 0; }
.gz-term__meta div { min-width: 0; }
.gz-term__meta dt { font-style: italic; }
.gz-term__meta dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.gz-term__log { display: flex; flex-direction: column; max-height: 120px; overflow: auto; }
.gz-term__log:empty { display: none; }

.gz-theme { display: inline-flex; align-items: center; justify-content: center; width: var(--control-height); height: var(--control-height); padding: 0; background: none; border: 0; color: var(--ink); font: 400 16px/1 var(--font-sans); cursor: pointer; }
.gz-theme:focus-visible { outline: var(--border-hairline) solid var(--focus-ring); outline-offset: var(--focus-offset); }
.gz-title { font: 400 16px/22px var(--font-sans); display: flex; align-items: center; }
.gz-mode { margin: 0; padding: 0 var(--space-1); background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }
.gz-mode:hover { outline: var(--border-hairline) solid var(--line); outline-offset: 0; }
.gz-mode:focus-visible { outline: var(--border-hairline) solid var(--focus-ring); outline-offset: var(--focus-offset); }


/* --- Pagina --- */
.bar { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--space-4); height: 44px; padding: 0 var(--space-4); background: var(--surface); border-bottom: var(--border-hairline) solid var(--line); }
.notice { text-align: center; text-transform: lowercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notice.is-busy, .breathe { animation: breathe 2s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .notice.is-busy, .breathe { animation: none; } }

.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 420px); gap: var(--space-5); padding: var(--space-4); max-width: 1400px; margin: 0 auto; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); gap: var(--space-4); } }
.col { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }

.vf { position: relative; border: var(--border-hairline) solid var(--line); background: var(--surface); overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.vf canvas { display: block; width: 100%; height: auto; }
.vf__off { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-3); padding: var(--space-4); text-align: center; background: var(--surface); }
.vf__off p { max-width: 36ch; font: italic 400 10px/14px var(--font-sans); }
.vf__off[hidden] { display: none; }
.vf__blink { position: absolute; inset: 0; background: var(--ink); opacity: 0; pointer-events: none; }
.vf__blink.is-on { opacity: 1; }
@media (prefers-reduced-motion: no-preference) { .vf__blink { transition: opacity 80ms ease-out; } .vf__blink.is-on { transition: opacity 0ms; } }
.vf-foot { display: flex; justify-content: space-between; gap: var(--space-4); font: italic 400 10px/14px var(--font-sans); margin-top: calc(-1 * var(--space-3)); }

.shoot { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: var(--space-2); }
.shoot .gz-btn { position: relative; }
.shoot .gz-btn::after { content: ""; position: absolute; inset: -8px 0; } /* area di tocco da 44px */

.roll { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.roll button { position: relative; display: block; padding: 0; margin: 0 -1px -1px 0; border: var(--border-hairline) solid var(--line); background: var(--surface); cursor: pointer; aspect-ratio: 1; overflow: hidden; }
.roll button img { width: 100%; height: 100%; object-fit: cover; display: block; }
.roll button:focus-visible { outline: var(--border-hairline) solid var(--focus-ring); outline-offset: var(--focus-offset); z-index: 1; }
.roll-empty { font: italic 400 16px/22px var(--font-sans); }
.detail { display: flex; flex-direction: column; gap: var(--space-2); }
.detail img { display: block; width: 100%; height: auto; border: var(--border-hairline) solid var(--line); }
.detail[hidden], .rollview[hidden], .shootview[hidden] { display: none; }
.label-s { font: 400 10px/14px var(--font-sans); }
</style>
</head>
<body>

<header class="bar">
  <h1 class="gz-title">EX-M2&nbsp;<button class="gz-mode" id="mode" aria-label="Cambia vista: mirino o rullino">mirino</button></h1>
  <p class="notice" id="notice" role="status" aria-live="polite"></p>
  <button class="gz-theme" id="theme" aria-label="Cambia tema">●</button>
</header>

<main class="main">
  <div class="col">
    <section class="shootview col" id="shootview" aria-label="Mirino">
      <div class="vf" id="vf">
        <canvas id="gl" width="1200" height="900" aria-label="Mirino dal vivo con l'effetto applicato"></canvas>
        <div class="vf__blink" id="blink"></div>
        <div class="vf__off" id="off">
          <button class="gz-btn" id="power">Accendi la fotocamera</button>
          <p id="offmsg">Il mirino mostra già la resa della EX-M2. Tocca l'immagine o «Scatta» per fotografare.</p>
        </div>
      </div>
      <p class="vf-foot"><span id="foot-l">—</span><span id="foot-r"></span></p>
      <div class="shoot">
        <button class="gz-btn" id="shutter" disabled>Scatta</button>
        <button class="gz-btn gz-btn--secondary" id="flashbtn" aria-pressed="false">Flash</button>
        <button class="gz-btn gz-btn--secondary" id="flip" aria-label="Cambia fotocamera, anteriore o posteriore">Gira</button>
      </div>
    </section>

    <section class="rollview col" id="rollview" hidden aria-label="Rullino">
      <div class="detail" id="detail" hidden>
        <img id="detail-img" alt="Scatto selezionato">
        <div class="row" style="justify-content: space-between">
          <span class="label-s" id="detail-meta"></span>
          <span class="row">
            <button class="gz-btn gz-btn--ghost" id="d-close">Chiudi</button>
            <button class="gz-btn gz-btn--secondary" id="d-del">Elimina</button>
            <button class="gz-btn" id="d-save">Salva in Foto</button>
          </span>
        </div>
      </div>
      <div class="roll" id="roll"></div>
      <p class="roll-empty" id="roll-empty">Nessuno scatto: torna al mirino e fotografa.</p>
    </section>
  </div>

  <div class="col">
    <label class="gz-field">
      <span class="gz-field__label">Scena</span>
      <span class="gz-select">
        <select id="preset">
          <option value="giorno">Giorno</option>
          <option value="interno">Interno, luce calda</option>
          <option value="controluce">Controluce</option>
          <option value="flash">Flash</option>
          <option value="notte">Notte a mano libera</option>
          <option value="mosso">Posa lunga</option>
          <option value="pulito">Neutro</option>
        </select>
        <svg class="gz-select__chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M2 4.5l4 4 4-4"/></svg>
      </span>
    </label>
    <div class="pair">
      <label class="gz-field">
        <span class="gz-field__label">Dimensione</span>
        <span class="gz-select">
          <select id="size">
            <option value="1600">1600 × 1200</option>
            <option value="1280">1280 × 960</option>
            <option value="640">640 × 480</option>
          </select>
          <svg class="gz-select__chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M2 4.5l4 4 4-4"/></svg>
        </span>
      </label>
      <label class="gz-field">
        <span class="gz-field__label">Qualità</span>
        <span class="gz-select">
          <select id="quality">
            <option value="0.84">Fine</option>
            <option value="0.68" selected>Normale</option>
            <option value="0.5">Economia</option>
          </select>
          <svg class="gz-select__chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M2 4.5l4 4 4-4"/></svg>
        </span>
      </label>
    </div>
    <label class="gz-toggle">
      <span class="gz-toggle__text">Scrivi EXIF<span class="gz-toggle__help">Marca, modello, F3.2, 7,5 mm nel file salvato</span></span>
      <input type="checkbox" role="switch" id="exif">
    </label>
    <div class="gz-grid-area"><div class="gz-grid" id="grid" style="--gz-grid-cols: 1"></div></div>
    <div class="gz-term" aria-label="Dati">
      <dl class="gz-term__meta">
        <div><dt>prossimo file</dt><dd id="m-file">CIMG0001.JPG</dd></div>
        <div><dt>ultimo scatto</dt><dd id="m-last">—</dd></div>
        <div><dt>mirino</dt><dd id="m-fps">—</dd></div>
        <div><dt>camera</dt><dd id="m-cam">—</dd></div>
      </dl>
      <div class="gz-term__log" id="log"></div>
    </div>
  </div>
</main>

<script type="text/worker" id="worker-src">

"use strict";
let W = 0, H = 0, SR, SG, SB;

const LUT_IN = new Float32Array(256);
for (let i = 0; i < 256; i++) {
  const s = i / 255;
  let l = s <= 0.04045 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
  const ex = Math.max(0, s - 0.94) / 0.06;
  l += ex * ex * 1.6;          // i bianchi pieni erano più luminosi della scena registrata
  LUT_IN[i] = l;
}
const LUT_OUT = new Float32Array(4097);
for (let i = 0; i <= 4096; i++) {
  const l = i / 4096;
  LUT_OUT[i] = l <= 0.0031308 ? l * 12.92 : 1.055 * Math.pow(l, 1 / 2.4) - 0.055;
}
function enc(l) { return l <= 0 ? 0 : l >= 1 ? 1 : LUT_OUT[(l * 4096) | 0]; }

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function samp(a, x, y) {
  if (x < 0) x = 0; else if (x > W - 1) x = W - 1;
  if (y < 0) y = 0; else if (y > H - 1) y = H - 1;
  const x0 = x | 0, y0 = y | 0;
  const x1 = x0 < W - 1 ? x0 + 1 : x0, y1 = y0 < H - 1 ? y0 + 1 : y0;
  const fx = x - x0, fy = y - y0;
  const r0 = y0 * W, r1 = y1 * W;
  return (a[r0 + x0] * (1 - fx) + a[r0 + x1] * fx) * (1 - fy) + (a[r1 + x0] * (1 - fx) + a[r1 + x1] * fx) * fy;
}

/* --- Sfocature --- */
function boxH(s, d, r) {
  const inv = 1 / (2 * r + 1), wm = W - 1;
  for (let y = 0; y < H; y++) {
    const row = y * W;
    let acc = 0;
    for (let k = -r; k <= r; k++) acc += s[row + (k < 0 ? 0 : k > wm ? wm : k)];
    for (let x = 0; x < W; x++) {
      d[row + x] = acc * inv;
      const a = x + r + 1, b = x - r;
      acc += s[row + (a > wm ? wm : a)] - s[row + (b < 0 ? 0 : b)];
    }
  }
}
function boxV(s, d, r) {
  const inv = 1 / (2 * r + 1), hm = H - 1;
  for (let x = 0; x < W; x++) {
    let acc = 0;
    for (let k = -r; k <= r; k++) acc += s[(k < 0 ? 0 : k > hm ? hm : k) * W + x];
    for (let y = 0; y < H; y++) {
      d[y * W + x] = acc * inv;
      const a = y + r + 1, b = y - r;
      acc += s[(a > hm ? hm : a) * W + x] - s[(b < 0 ? 0 : b) * W + x];
    }
  }
}
function boxesForGauss(sigma) {
  const n = 3;
  const wIdeal = Math.sqrt(12 * sigma * sigma / n + 1);
  let wl = Math.floor(wIdeal); if (wl % 2 === 0) wl--;
  const wu = wl + 2;
  const m = Math.round((12 * sigma * sigma - n * wl * wl - 4 * n * wl - 3 * n) / (-4 * wl - 4));
  const r = [];
  for (let i = 0; i < n; i++) r.push(((i < m ? wl : wu) - 1) / 2);
  return r;
}
function gauss(src, sigma) {
  const N = W * H;
  if (sigma < 0.25) return src.slice();
  if (sigma < 0.8) {
    const rad = Math.ceil(sigma * 3), k = [];
    let sum = 0;
    for (let i = -rad; i <= rad; i++) { const v = Math.exp(-i * i / (2 * sigma * sigma)); k.push(v); sum += v; }
    for (let i = 0; i < k.length; i++) k[i] /= sum;
    const t = new Float32Array(N), d = new Float32Array(N);
    for (let y = 0; y < H; y++) {
      const row = y * W;
      for (let x = 0; x < W; x++) {
        let a = 0;
        for (let j = -rad; j <= rad; j++) { let xx = x + j; xx = xx < 0 ? 0 : xx >= W ? W - 1 : xx; a += src[row + xx] * k[j + rad]; }
        t[row + x] = a;
      }
    }
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        let a = 0;
        for (let j = -rad; j <= rad; j++) { let yy = y + j; yy = yy < 0 ? 0 : yy >= H ? H - 1 : yy; a += t[yy * W + x] * k[j + rad]; }
        d[y * W + x] = a;
      }
    }
    return d;
  }
  const rs = boxesForGauss(sigma);
  let a = src.slice(), b = new Float32Array(N);
  for (const r of rs) { if (r < 1) continue; boxH(a, b, r); boxV(b, a, r); }
  return a;
}

/* --- Tremolio della mano: una traiettoria a passeggiata casuale, non una riga dritta --- */
function shakeKernel(len, angDeg, rng) {
  const steps = Math.max(3, Math.round(len * 2.5));
  const pts = [];
  let x = 0, y = 0, a = angDeg * Math.PI / 180, va = 0;
  const step = len / steps;
  for (let i = 0; i < steps; i++) {
    const w = 0.4 + rng() * (i === 0 || i === steps - 1 ? 2.2 : 1);   // la mano indugia agli estremi
    pts.push([x, y, w]);
    va = va * 0.85 + (rng() - 0.5) * 0.9;
    a += va * 0.35;
    x += Math.cos(a) * step; y += Math.sin(a) * step;
  }
  let mx = 0, my = 0, sw = 0;
  for (const p of pts) { mx += p[0] * p[2]; my += p[1] * p[2]; sw += p[2]; }
  mx /= sw; my /= sw;
  const map = new Map();
  for (const [px, py, w] of pts) {
    const fx = px - mx, fy = py - my, ix = Math.floor(fx), iy = Math.floor(fy), ax = fx - ix, ay = fy - iy;
    const add = (dx, dy, v) => { const key = dx + "," + dy; map.set(key, (map.get(key) || 0) + v); };
    add(ix, iy, w * (1 - ax) * (1 - ay)); add(ix + 1, iy, w * ax * (1 - ay));
    add(ix, iy + 1, w * (1 - ax) * ay); add(ix + 1, iy + 1, w * ax * ay);
  }
  const taps = [];
  let tot = 0;
  for (const [k, v] of map) { if (v < 1e-4) continue; const [dx, dy] = k.split(",").map(Number); taps.push([dx, dy, v]); tot += v; }
  for (const t of taps) t[2] /= tot;
  return taps;
}
function convolve(src, taps) {
  const d = new Float32Array(W * H);
  for (const [dx, dy, w] of taps) {
    for (let y = 0; y < H; y++) {
      let sy = y + dy; sy = sy < 0 ? 0 : sy >= H ? H - 1 : sy;
      const srow = sy * W, drow = y * W;
      const x0 = Math.max(0, -dx), x1 = Math.min(W, W - dx);
      for (let x = 0; x < x0; x++) d[drow + x] += w * src[srow];
      for (let x = x0; x < x1; x++) d[drow + x] += w * src[srow + x + dx];
      for (let x = x1; x < W; x++) d[drow + x] += w * src[srow + W - 1];
    }
  }
  return d;
}

function render(p, seed) {
  const N = W * H;
  const rngShake = mulberry32(seed ^ 0x9E3779B9);
  const rng = mulberry32(seed + 7);
  const gn = () => (rng() + rng() + rng() - 1.5) * 2;
  const cx = (W - 1) / 2, cy = (H - 1) / 2, n2 = 1 / (cx * cx + cy * cy);

  /* 1. Obiettivo: distorsione a barilotto, aberrazione cromatica laterale, vignettatura */
  let R = new Float32Array(N), G = new Float32Array(N), B = new Float32Array(N);
  const k = p.dist * 0.09, kn = 1 / (1 + k), caS = p.ca * 0.0032, vg = p.vig * 0.85;
  for (let y = 0; y < H; y++) {
    const dy = y - cy;
    for (let x = 0; x < W; x++) {
      const dx = x - cx, r2 = (dx * dx + dy * dy) * n2;
      const s = (1 + k * r2) * kn, i = y * W + x;
      const vv = 1 + vg * r2, gain = 1 / (vv * vv);
      const sr = s * (1 + caS), sb = s * (1 - caS);
      R[i] = samp(SR, cx + dx * sr, cy + dy * sr) * gain;
      G[i] = samp(SG, cx + dx * s, cy + dy * s) * gain;
      B[i] = samp(SB, cx + dx * sb, cy + dy * sb) * gain;
    }
  }

  /* 2. Morbidezza della lente, più forte ai bordi */
  const s0 = 0.3 + p.soft * 0.75, s1 = s0 + p.soft * 1.7;
  R = gauss(R, s0); G = gauss(G, s0); B = gauss(B, s0);
  if (p.soft > 0.01) {
    const ex = Math.sqrt(s1 * s1 - s0 * s0);
    const chans = [R, G, B];
    for (const c of chans) {
      const bl = gauss(c, ex);
      for (let y = 0; y < H; y++) {
        const dy = y - cy;
        for (let x = 0; x < W; x++) {
          const dx = x - cx; let t = (dx * dx + dy * dy) * n2; t = t * t;
          const i = y * W + x; c[i] += (bl[i] - c[i]) * t;
        }
      }
    }
  }

  /* 3. Fuori fuoco (fuoco fisso da 1 m in poi) */
  if (p.focus > 0.005) { const sg = p.focus * 11; R = gauss(R, sg); G = gauss(G, sg); B = gauss(B, sg); }

  /* 4. Mosso */
  if (p.shake > 0.005) {
    const taps = shakeKernel(1 + p.shake * 38, p.dir, rngShake);
    R = convolve(R, taps); G = convolve(G, taps); B = convolve(B, taps);
  }

  /* 5. Esposizione e flash a bordo */
  const ev = Math.pow(2, p.ev), f = p.flash;
  for (let y = 0; y < H; y++) {
    const dy = y - cy;
    for (let x = 0; x < W; x++) {
      const dx = x - cx, r2 = (dx * dx + dy * dy) * n2, i = y * W + x;
      let g = ev;
      if (f > 0) g *= 1 + f * (2.4 * Math.exp(-r2 / 0.16) - 0.6);
      R[i] *= g * (1 - 0.05 * f); G[i] *= g; B[i] *= g * (1 + 0.07 * f);
    }
  }

  /* 6. CCD: smear verticale, bloom e frange viola attorno alle luci sature */
  const E = new Float32Array(N);
  let anyE = false;
  for (let i = 0; i < N; i++) {
    const L = 0.2126 * R[i] + 0.7152 * G[i] + 0.0722 * B[i];
    const e = L - 2.5; if (e > 0) { E[i] = e; anyE = true; }
  }
  if (anyE && (p.smear > 0.005 || p.ca > 0.005)) {
    const col = new Float32Array(W);
    for (let y = 0; y < H; y++) { const row = y * W; for (let x = 0; x < W; x++) col[x] += E[row + x]; }
    const ks = p.smear * 2.6 / H;
    for (let x = 0; x < W; x++) col[x] *= ks;
    const bl = p.smear > 0.005 ? gauss(E, 3 + p.smear * 5) : null;
    const kb = p.smear * 0.5;
    let fr = null;
    if (p.ca > 0.005) {
      const M = new Float32Array(N);
      for (let i = 0; i < N; i++) M[i] = E[i] > 0 ? 1 : 0;
      fr = gauss(M, 1.5 + p.ca * 3);
      for (let i = 0; i < N; i++) { const v = fr[i] - M[i]; fr[i] = v > 0 ? v * p.ca * 0.22 : 0; }
    }
    for (let y = 0; y < H; y++) {
      const row = y * W;
      for (let x = 0; x < W; x++) {
        const i = row + x, sm = col[x], b = bl ? bl[i] * kb : 0, q = fr ? fr[i] : 0;
        R[i] += sm * 1.02 + b + q * 0.6;
        G[i] += sm * 0.96 + b + q * 0.04;
        B[i] += sm * 1.05 + b + q * 0.95;
      }
    }
  }

  /* 7. Rumore del sensore: fotonico, di lettura, cromatico a macchie, bande orizzontali */
  const ns = p.noise, cs = p.chroma;
  if (ns > 0.002 || cs > 0.002) {
    const fw = Math.ceil(W / 3) + 2, fh = Math.ceil(H / 3) + 2;
    const C1 = new Float32Array(fw * fh), C2 = new Float32Array(fw * fh);
    for (let i = 0; i < C1.length; i++) { C1[i] = gn(); C2[i] = gn(); }
    const rows = new Float32Array(H);
    for (let y = 0; y < H; y++) rows[y] = gn() * ns * 0.0025;
    for (let y = 0; y < H; y++) {
      const fy = y / 3, y0 = fy | 0, ay = fy - y0;
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        const L = (R[i] + G[i] + B[i]) / 3, sq = Math.sqrt(L > 0 ? L : 0);
        const sd = ns * (0.009 + 0.05 * sq);
        const nl = gn() * sd + rows[y];
        R[i] += nl + gn() * sd * 0.6;
        G[i] += nl + gn() * sd * 0.45;
        B[i] += nl + gn() * sd * 0.75;
        if (cs > 0.002) {
          const fx = x / 3, x0 = fx | 0, ax = fx - x0, j = y0 * fw + x0;
          const c1 = (C1[j] * (1 - ax) + C1[j + 1] * ax) * (1 - ay) + (C1[j + fw] * (1 - ax) + C1[j + fw + 1] * ax) * ay;
          const c2 = (C2[j] * (1 - ax) + C2[j + 1] * ax) * (1 - ay) + (C2[j + fw] * (1 - ax) + C2[j + fw + 1] * ax) * ay;
          const ca = cs * (0.006 + 0.032 * sq);
          R[i] += c1 * ca; B[i] += c2 * ca; G[i] -= (c1 + c2) * 0.45 * ca;
        }
      }
    }
  }

  /* 8. Spalla delle alte luci, taglio per canale (le alte luci virano), bilanciamento del bianco */
  const hl = 1 + p.hl * 1.6;
  const wr = 1 + 0.22 * p.temp - 0.04 * p.tint, wg = 1 + 0.08 * p.tint, wb = 1 - 0.22 * p.temp - 0.04 * p.tint;
  const ct = p.ct, bk = p.sh * 0.13, bki = 1 / (1 - bk), sat = p.sat;
  const Y = new Float32Array(N); let Cb = new Float32Array(N), Cr = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    let r = R[i], g = G[i], b = B[i];
    if (r > 0.5) r = 0.5 + (r - 0.5) * hl; if (g > 0.5) g = 0.5 + (g - 0.5) * hl; if (b > 0.5) b = 0.5 + (b - 0.5) * hl;
    r = r < 0 ? 0 : r > 1 ? 1 : r; g = g < 0 ? 0 : g > 1 ? 1 : g; b = b < 0 ? 0 : b > 1 ? 1 : b;
    r *= wr; g *= wg; b *= wb;
    /* 9. Curva della fotocamera: gamma, contrasto a S, neri chiusi */
    r = enc(r); g = enc(g); b = enc(b);
    r += (r * r * (3 - 2 * r) - r) * ct; g += (g * g * (3 - 2 * g) - g) * ct; b += (b * b * (3 - 2 * b) - b) * ct;
    r = (r - bk) * bki; g = (g - bk) * bki; b = (b - bk) * bki;
    r = r < 0 ? 0 : r; g = g < 0 ? 0 : g; b = b < 0 ? 0 : b;
    /* 10. Colore CCD: saturazione, rossi un po' spinti */
    const yy = 0.299 * r + 0.587 * g + 0.114 * b;
    r = yy + (r - yy) * sat * 1.06; g = yy + (g - yy) * sat * 0.97; b = yy + (b - yy) * sat * 1.03;
    const y2 = 0.299 * r + 0.587 * g + 0.114 * b;
    Y[i] = y2; Cb[i] = b - y2; Cr[i] = r - y2;
  }

  /* 11. Elaborazione in camera: riduzione rumore sulla crominanza, nitidezza con aloni */
  const ss = 0.5 + ns * 1.3;
  Cb = gauss(Cb, ss); Cr = gauss(Cr, ss);
  if (p.sharp > 0.005) {
    const Yb = gauss(Y, 1.35), a = p.sharp * 2.3;
    for (let i = 0; i < N; i++) { let d = Y[i] - Yb[i]; d = d > 0.22 ? 0.22 : d < -0.22 ? -0.22 : d; Y[i] += d * a; }
  }
  const out = new Uint8ClampedArray(N * 4);
  for (let i = 0; i < N; i++) {
    const r = Y[i] + Cr[i], b = Y[i] + Cb[i], g = (Y[i] - 0.299 * r - 0.114 * b) / 0.587;
    const o = i * 4;
    out[o] = r * 255 + 0.5; out[o + 1] = g * 255 + 0.5; out[o + 2] = b * 255 + 0.5; out[o + 3] = 255;
  }
  return out;
}

onmessage = (e) => {
  const m = e.data;
  if (m.type === "source") {
    W = m.w; H = m.h;
    const d = m.data, N = W * H;
    SR = new Float32Array(N); SG = new Float32Array(N); SB = new Float32Array(N);
    for (let i = 0; i < N; i++) { SR[i] = LUT_IN[d[i * 4]]; SG[i] = LUT_IN[d[i * 4 + 1]]; SB[i] = LUT_IN[d[i * 4 + 2]]; }
  } else if (m.type === "render") {
    const t = performance.now();
    try {
      const out = render(m.p, m.seed);
      postMessage({ type: "done", id: m.id, w: W, h: H, data: out, ms: performance.now() - t }, [out.buffer]);
    } catch (err) {
      postMessage({ type: "error", id: m.id, message: String(err && err.message || err) });
    }
  }
};

</script>

<script id="glsl-common" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D uV;
uniform vec4 uCrop;
uniform float uMirror;
vec3 srcLin(vec2 uv) {
  vec2 q = vec2(uv.x, 1.0 - uv.y);
  if (uMirror > 0.5) q.x = 1.0 - q.x;
  q = uCrop.xy + clamp(q, 0.0, 1.0) * uCrop.zw;
  vec3 s = texture(uV, q).rgb;
  vec3 l = mix(s / 12.92, pow((s + 0.055) / 1.055, vec3(2.4)), step(0.04045, s));
  vec3 ex = max(vec3(0.0), s - 0.94) / 0.06;

<script id="glsl-smear" type="x-shader/x-fragment">
uniform vec2 uRes;
uniform float uEv, uK;
out vec4 o;
void main() {
  float x = gl_FragCoord.x / uRes.x, s = 0.0;
  for (int i = 0; i < 64; i++) {
    vec3 c = srcLin(vec2(x, (float(i) + 0.5) / 64.0)) * uEv;
    s += max(0.0, dot(c, vec3(0.2126, 0.7152, 0.0722)) - 2.5);
  }
  o = vec4(vec3(clamp(s / 64.0 * uK / 4.0, 0.0, 1.0)), 1.0);
}

<script id="glsl-finish" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D uA;
uniform vec2 uRes;
uniform float uSharp, uScale;

<script>
"use strict";
const $ = (id) => document.getElementById(id);

/* --- Tema --- */
(function () {
  let t = null;
  try { t = localStorage.getItem("exm2-theme"); } catch (e) {}
  if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  const apply = (n) => { document.documentElement.dataset.theme = n; document.querySelector('meta[name="theme-color"]').content = n === "dark" ? "#000000" : "#ffffff"; };
  apply(t);
  $("theme").addEventListener("click", () => {
    const n = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    apply(n);
    try { localStorage.setItem("exm2-theme", n); } catch (e) {}
  });
})();

let noticeTimer = 0;
function notice(text, busy) {
  const el = $("notice");
  clearTimeout(noticeTimer);
  el.textContent = text;
  el.classList.toggle("is-busy", !!busy);
  if (!busy && text) noticeTimer = setTimeout(() => { el.textContent = ""; }, 3200);
}
function log(text) {
  const el = $("log"), d = document.createElement("div");
  d.textContent = text; el.appendChild(d);
  while (el.children.length > 30) el.firstChild.remove();
  el.scrollTop = el.scrollHeight;
}

/* --- Regolazioni --- */
const POSA = [1, 2, 3, 4, 6, 8, 10];
const DEFS = [
  { k: "ev", l: "Esposizione", min: -20, max: 20, f: (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v / 10).toFixed(1).replace(".", ",") + " EV" },
  { k: "posa", l: "Posa", min: 0, max: POSA.length - 1, f: (v) => "1/" + Math.round(30 / POSA[v]) + " s", keep: true },
  { k: "hl", l: "Alte luci" },
  { k: "sh", l: "Ombre" },
  { k: "ct", l: "Contrasto" },
  { k: "sat", l: "Saturazione", max: 200 },
  { k: "temp", l: "Temperatura", min: -100, max: 100, f: (v) => (v > 0 ? "calda " : v < 0 ? "fredda " : "") + Math.abs(v), keep: true },
  { k: "tint", l: "Tinta", min: -100, max: 100, f: (v) => (v > 0 ? "verde " : v < 0 ? "magenta " : "") + Math.abs(v), keep: true },
  { k: "flash", l: "Flash", f: (v) => v ? String(v) : "spento" },
  { k: "soft", l: "Morbidezza" },
  { k: "focus", l: "Fuori fuoco" },
  { k: "vig", l: "Vignettatura" },
  { k: "dist", l: "Distorsione" },
